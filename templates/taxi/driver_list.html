<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drivers</title>
</head>
<body>
    <h1>Drivers</h1>
        <tr>
            <th>ID</th>
            <th>Username</th>
        </tr>
        {% for driver in object_list %}
        <tr>
            <br>
            <td>{{ driver.id }}</td>
            <td>
                <a href="{% url 'taxi:driver-detail' driver.id %}">
                    {{ driver.username }}
                </a>
                <br>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No drivers found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
