<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Manufacturers</h1>
    <table>
  <tr>
    <td>ID</td>
    <td>Name</td>
    <td>Country</td>
  </tr>
        {% for manufacturer in object_list %}
  <tr>
    <td>{{ manufacturer.id }}</td>
    <td>{{ manufacturer.name }}</td>
    <td>{{ manufacturer.country }}</td>
  </tr>
        {% endfor %}
</table>
</body>
</html>
